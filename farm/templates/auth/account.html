{% extends 'base.html' %}{% import 'partials/macros.html' as m with context %}
{% set page_title = 'My account' %}
{% block content %}
<form method="post" class="card form-card" style="max-width:520px">
  {{ m.csrf() }}
  <div class="card-header"><h2 class="card-title-sm mb-0">Change password</h2></div>
  <div class="card-body">
    <label class="form-label">Current password</label><input type="password" name="current" class="form-control mb-3" required autocomplete="current-password">
    <label class="form-label">New password</label><input type="password" name="new" class="form-control mb-3" required minlength="8" autocomplete="new-password">
    <label class="form-label">Confirm new password</label><input type="password" name="confirm" class="form-control" required minlength="8" autocomplete="new-password">
  </div>
  <div class="card-footer text-end"><button class="btn btn-success">Change password</button></div>
</form>
{% endblock %}
